model:
  model_name: tp_sa
  clip_model: "ViT-L/14"
  attr_loss_weight: 1.0
  attr_inference_weight: 1.0
  obj_loss_weight: 1.0
  obj_inference_weight: 1.0
  num_encoder_layers: 2   # 2
  num_heads: 4            # 4
  query_nums: [10,10,10]
  proj_first: True
  cls_token: True
  return_patch: True

train:
  experiment_name: tp_sa_2_4_all
  split: multi_attr_split_all
  dataset_path: /root/autodl-tmp/data/CZSL/multi_attr
  optimizer: Adam
  scheduler: None
  step_size: 5
  gamma: 0.5
  lr: 0.00005
#  attr_dropout: 0.3
  weight_decay: 0.00001
  context_length: 8
  train_batch_size: 48
  gradient_accumulation_steps: 2
  seed: 0
  epochs: 40
  save_path: 
  val_metric: best_loss
  save_final_model: True
  multi_label_loss: BCE
  load_model: 
  train_vocab: False
  disent: False
test:
  test_context_length: 16
  eval_batch_size: 64
  open_world: False
  topk: 1
  text_encoder_batch_size: 1024
  threshold_trials: 50
  bias: 0.001
  text_first: True