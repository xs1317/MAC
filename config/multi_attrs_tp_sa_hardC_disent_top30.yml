model:
  model_name: tp_sa_hardC_disent
  clip_model: "ViT-L/14"
  # clip_model: 
  # branch
  # pair_loss_weight: 0.0
  # pair_inference_weight: 0.0
  attr_loss_weight: 1.0
  attr_inference_weight: 1.0
  obj_loss_weight: 1.0
  obj_inference_weight: 1.0
  num_encoder_layers: 3
  num_heads: 8
  query_nums: [10,10,10]
  proj_first: True
  cls_token: True
  return_patch: True
  use_encoded_text: True

train:
  experiment_name: tp_sa_new_3_8_hardC_disent_top30
  split: multi_attr_split_all
  dataset_path: /root/autodl-tmp/data/CZSL/multi_attr
  optimizer: Adam
  scheduler: None
  step_size: 5
  gamma: 0.5
  lr: 0.00005
  attr_dropout: 0.3
  weight_decay: 0.00001
  context_length: 8
  train_batch_size: 6
  gradient_accumulation_steps: 2
  seed: 0
  epochs: 40
  save_path: /root/autodl-tmp/Models/csp/pretrain/multi_attr/tp_sa
  val_metric: best_loss
  save_final_model: True
  load_model:  /root/autodl-tmp/Models/csp/pretrain/multi_attr/tp_sa/tp_sa_new_3_8_hardC_disent_top30/epoch_39.pt
  multi_label_loss: BCE
  wandb: True
  aux_loss: False
  train_vocab: True
  primitive_topk: 30
test:
  test_context_length: 16
  eval_batch_size: 16
  open_world:   False
  topk: 1
  text_encoder_batch_size: 1024
  threshold_trials: 50
  bias: 0.001
  text_first: True