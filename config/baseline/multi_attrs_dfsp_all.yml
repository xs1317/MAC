model:
  model_name: dfsp
  fusion: txt2img
  K: 1
  prompt_template: "a photo of x x"
  clip_model: "ViT-L/14"
  res_w: 0.8
  SA_K: 1
  width_img: 1024
  width_txt: 768

train:
  experiment_name: dfsp_single_BCE
  dataset: multi-attrs
  split: multi_attr_split_all
  dataset_path: 
  lr: 0.00005
  attr_dropout: 0.3
  weight_decay: 0.00001
  context_length: 8
  train_batch_size: 4
  gradient_accumulation_steps: 2
  seed: 0
  epochs: 40
  epoch_start: 0
  save_path:
  best_model_metric: best_loss    
  load_training: True
  load_model:
  att_obj_w: 0.01
  sp_w: 0.1
  multi_label_loss: BCE
  wandb: True
test:
  test_context_length: 8
  eval_batch_size: 16
  open_world: False
  topk: 1
  text_encoder_batch_size: 36
  threshold: 0.4
  threshold_trials: 50
  bias: 0.001